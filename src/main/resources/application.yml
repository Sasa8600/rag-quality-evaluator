spring:
  application:
    name: rag-quality-evaluator
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_evaluator
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

ollama:
  base-url: http://localhost:11434
  embedding-model: nomic-embed-text
  generation-model: mistral

logging:
  level:
    root: INFO
    com.rageval: DEBUG

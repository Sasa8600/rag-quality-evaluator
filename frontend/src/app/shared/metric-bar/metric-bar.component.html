<div class="metric-row">
  <span class="metric-label">{{ label }}</span>
  <div class="metric-track">
    @if (isAvailable) {
      <div class="metric-fill" [class]="level" [style.width.%]="pct"></div>
    } @else {
      <div class="metric-fill unavailable" style="width:100%"></div>
    }
  </div>
  @if (isAvailable) {
    <span class="metric-value">{{ value | number: '1.2-2' }}</span>
  } @else {
    <span class="metric-value metric-na" title="No ground truth (relevantDocIds) to compute this against">N/A</span>
  }
</div>
